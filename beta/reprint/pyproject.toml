[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dreamcalendars-reprint"
version = "0.1.0"
description = "Source-backed school-calendar change impact and household care planning prototype"
requires-python = ">=3.11"

[project.scripts]
dreamreprint = "dreamreprint.cli:main"

[tool.setuptools.packages.find]
include = ["dreamreprint*"]
